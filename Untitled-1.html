<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LakkiReddy Sannihith - Sr BI/Data Analyst</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2A5C82;
            --secondary-color: #FF6B6B;
            --accent-color: #4ECDC4;
            --dark-color: #2D3436;
            --light-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--light-color);
            color: var(--dark-color);
        }

        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: #fff;
            padding: 40px 0;
            text-align: center;
            position: relative;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: var(--primary-color);
            border-left: 5px solid var(--secondary-color);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .skill-item {
            text-align: center;
            padding: 20px;
            background: var(--light-color);
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .skill-item:hover {
            transform: translateY(-5px);
        }

        .skill-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .certification-badge {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 10px 0;
        }

        .certification-badge img {
            width: 60px;
            height: 60px;
        }

        footer {
            background: var(--dark-color);
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links a {
            color: white;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <header>
        <img src="your-profile-image.jpg" alt="LakkiReddy Sannihith" class="profile-img">
        <h1>LakkiReddy Sannihith</h1>
        <p>Senior BI/Data Analyst</p>
    </header>

    <div class="container">
        <!-- Professional Summary Section -->
        <div class="section">
            <h2>Professional Summary</h2>
            <!-- Content remains same as before -->
        </div>

        <!-- Certifications Section -->
        <div class="section">
            <h2>Certifications</h2>
            <div class="certification-badge">
                <img src="aws-certified-logo.png" alt="AWS Certified">
                <div>
                    <h3>AWS Certified Cloud Practitioner</h3>
                    <p>Issued: 2023 | Validation ID: ABC123XYZ</p>
                </div>
            </div>
        </div>

        <!-- Technical Skills with Icons -->
        <div class="section">
            <h2>Technical Skills</h2>
            <div class="skills-grid">
                <div class="skill-item">
                    <i class="fab fa-python skill-icon"></i>
                    <h3>Python</h3>
                </div>
                <div class="skill-item">
                    <i class="fas fa-database skill-icon"></i>
                    <h3>SQL</h3>
                </div>
                <div class="skill-item">
                    <i class="fab fa-aws skill-icon"></i>
                    <h3>AWS</h3>
                </div>
                <div class="skill-item">
                    <i class="fas fa-chart-line skill-icon"></i>
                    <h3>Power BI</h3>
                </div>
                <!-- Add more skills as needed -->
            </div>
        </div>

        <!-- Rest of your sections (Experience, Education) -->

    </div>

    <footer>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/lakkir219/" target="_blank">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:Lakkir219@gmail.com">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="#">
                <i class="fab fa-github"></i>
            </a>
        </div>
        <p>&copy; 2023 LakkiReddy Sannihith. All rights reserved.</p>
    </footer>

</body>
</html>
